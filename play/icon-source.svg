<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source SVG for the Play Store hi-res icon (512x512 PNG, generated by
  scripts/render_play_icon.sh). Mirrors the adaptive launcher icon but
  bakes the background colour into the image, since the Play UI applies
  its own corner masking and doesn't use the Android adaptive-icon model.

  The knight figure is the Cburnett knight (CC-BY-SA 3.0, Colin M.L. Burnett;
  see THIRD_PARTY_NOTICES.md). Same paths and palette as
  app/src/main/res/drawable/ic_launcher_foreground.xml, just rescaled to
  fill a larger fraction of the frame (no launcher-mask safe-zone needed).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1F2937"/>
  <!--
    Knight in its native 45x45 coordinates. Scale 8 -> 360x360, translate (76,76)
    so it sits centred with a ~76px margin all round.
  -->
  <g transform="translate(76 76) scale(8)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
    <path fill="#F3F4F6" stroke="#F3F4F6" fill-rule="evenodd"
          d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
    <path fill="#F3F4F6" stroke="#F3F4F6" fill-rule="evenodd"
          d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.04-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-1-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-2 2.5-3c1 0 1 3 1 3"/>
    <path fill="#1F2937" stroke="#1F2937" fill-rule="evenodd"
          d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.43-9.75a.5 1.5 30 1 1-.86-.5.5 1.5 30 1 1 .86.5"/>
    <path fill="#1F2937" fill-rule="evenodd"
          d="m24.55 10.4-.45 1.45.5.15c3.15 1 5.65 2.49 7.9 6.75S35.75 29.06 35.25 39l-.05.5h2.25l.05-.5c.5-10.06-.88-16.85-3.25-21.34s-5.79-6.64-9.19-7.16z"/>
  </g>
</svg>
