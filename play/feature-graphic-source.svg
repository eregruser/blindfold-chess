<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source SVG for the Play Store feature graphic (1024x500 PNG, generated by
  scripts/render_feature_graphic.sh).

  Layout: knight icon on the left, app name + tagline stacked to its right.
  All critical content sits in the left ~70% of the frame so Play Store UI
  overlays (Install badges, gradient masks) on the right edge don't obscure
  anything important.

  Background colour and knight artwork match play/icon-source.svg so the
  graphic, listing icon, and in-app launcher icon all read as one brand.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <rect width="1024" height="500" fill="#1F2937"/>

  <!--
    Knight: native 45x45 viewport, scale 6.4 -> 288x288, positioned at (56, 106)
    so it's vertically centred within the 500px height.
  -->
  <g transform="translate(56 106) scale(6.4)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
    <path fill="#F3F4F6" stroke="#F3F4F6" fill-rule="evenodd"
          d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21"/>
    <path fill="#F3F4F6" stroke="#F3F4F6" fill-rule="evenodd"
          d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.04-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-1-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-2 2.5-3c1 0 1 3 1 3"/>
    <path fill="#1F2937" stroke="#1F2937" fill-rule="evenodd"
          d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.43-9.75a.5 1.5 30 1 1-.86-.5.5 1.5 30 1 1 .86.5"/>
    <path fill="#1F2937" fill-rule="evenodd"
          d="m24.55 10.4-.45 1.45.5.15c3.15 1 5.65 2.49 7.9 6.75S35.75 29.06 35.25 39l-.05.5h2.25l.05-.5c.5-10.06-.88-16.85-3.25-21.34s-5.79-6.64-9.19-7.16z"/>
  </g>

  <!--
    Text block. Font stack falls back through what's typically present on
    Linux rendering hosts (Noto Sans / DejaVu Sans / Liberation Sans) and
    then to the generic sans-serif. rsvg-convert resolves through fontconfig.
  -->
  <g font-family="Noto Sans, DejaVu Sans, Liberation Sans, sans-serif" fill="#F3F4F6">
    <text x="400" y="230" font-size="78" font-weight="700" letter-spacing="-2">Blindfold Chess</text>
    <text x="400" y="290" font-size="32" font-weight="400" fill="#9CA3AF">Play hands-free vs. Stockfish.</text>
    <text x="400" y="330" font-size="32" font-weight="400" fill="#9CA3AF">Headset + voice. Fully offline.</text>
  </g>
</svg>
